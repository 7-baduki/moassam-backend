name: develop

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io/7-baduki/moassam-backend

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload JAR
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/*.jar
          retention-days: 1

  docker-build:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_name: ${{ steps.image.outputs.image_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: build/libs/

      - name: Resolve image tag
        id: image
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "image_name=${REGISTRY}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "image_name=${REGISTRY}:develop" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.image_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-dev:
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Package and upload deployment bundle
        run: |
          tar -czf deploy.tar.gz deploy
          sha256sum deploy.tar.gz > deploy.tar.gz.sha256
          aws s3 cp deploy.tar.gz "s3://${{ secrets.AWS_DEPLOY_BUCKET }}/releases/${GITHUB_SHA}/deploy.tar.gz"
          aws s3 cp deploy.tar.gz.sha256 "s3://${{ secrets.AWS_DEPLOY_BUCKET }}/releases/${GITHUB_SHA}/deploy.tar.gz.sha256"

      - name: Deploy to dev EC2 through SSM
        env:
          DEPLOY_BUCKET: ${{ secrets.AWS_DEPLOY_BUCKET }}
          INSTANCE_ID: ${{ secrets.AWS_INSTANCE_ID }}
          IMAGE_NAME: ${{ needs.docker-build.outputs.image_name }}
        run: |
          cat > ssm-command.sh <<EOF
          set -Eeuo pipefail
          DEPLOY_BUCKET='${DEPLOY_BUCKET}'
          IMAGE_NAME='${IMAGE_NAME}'
          WORK_DIR=/opt/moassam
          RELEASE_DIR="\$WORK_DIR/releases/${GITHUB_SHA}"
          TEMP_DIR="\$(mktemp -d)"
          trap 'rm -rf "\$TEMP_DIR"' EXIT
          aws s3 cp "s3://\${DEPLOY_BUCKET}/releases/${GITHUB_SHA}/deploy.tar.gz" "\$TEMP_DIR/deploy.tar.gz"
          aws s3 cp "s3://\${DEPLOY_BUCKET}/releases/${GITHUB_SHA}/deploy.tar.gz.sha256" "\$TEMP_DIR/deploy.tar.gz.sha256"
          (cd "\$TEMP_DIR" && sha256sum -c deploy.tar.gz.sha256)
          mkdir -p "\$RELEASE_DIR"
          tar -xzf "\$TEMP_DIR/deploy.tar.gz" -C "\$RELEASE_DIR"
          ln -s "\$RELEASE_DIR" "\$WORK_DIR/current.next"
          mv -Tf "\$WORK_DIR/current.next" "\$WORK_DIR/current"
          bash "\$WORK_DIR/current/deploy/scripts/ssm-deploy.sh" dev "\${IMAGE_NAME}"
          EOF
          ENCODED_COMMAND=$(base64 -w 0 ssm-command.sh)
          jq -n --arg command "echo $ENCODED_COMMAND | base64 -d | sudo bash" \
            '{commands: [$command]}' > ssm-parameters.json
          COMMAND_ID=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$INSTANCE_ID" \
            --parameters file://ssm-parameters.json \
            --query 'Command.CommandId' \
            --output text)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"

  deploy-prod:
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Package and upload deployment bundle
        run: |
          tar -czf deploy.tar.gz deploy
          sha256sum deploy.tar.gz > deploy.tar.gz.sha256
          aws s3 cp deploy.tar.gz "s3://${{ secrets.AWS_DEPLOY_BUCKET }}/releases/${GITHUB_SHA}/deploy.tar.gz"
          aws s3 cp deploy.tar.gz.sha256 "s3://${{ secrets.AWS_DEPLOY_BUCKET }}/releases/${GITHUB_SHA}/deploy.tar.gz.sha256"

      - name: Deploy to prod EC2 through SSM
        env:
          DEPLOY_BUCKET: ${{ secrets.AWS_DEPLOY_BUCKET }}
          INSTANCE_ID: ${{ secrets.AWS_INSTANCE_ID }}
          IMAGE_NAME: ${{ needs.docker-build.outputs.image_name }}
        run: |
          cat > ssm-command.sh <<EOF
          set -Eeuo pipefail
          DEPLOY_BUCKET='${DEPLOY_BUCKET}'
          IMAGE_NAME='${IMAGE_NAME}'
          WORK_DIR=/opt/moassam
          RELEASE_DIR="\$WORK_DIR/releases/${GITHUB_SHA}"
          TEMP_DIR="\$(mktemp -d)"
          trap 'rm -rf "\$TEMP_DIR"' EXIT
          aws s3 cp "s3://\${DEPLOY_BUCKET}/releases/${GITHUB_SHA}/deploy.tar.gz" "\$TEMP_DIR/deploy.tar.gz"
          aws s3 cp "s3://\${DEPLOY_BUCKET}/releases/${GITHUB_SHA}/deploy.tar.gz.sha256" "\$TEMP_DIR/deploy.tar.gz.sha256"
          (cd "\$TEMP_DIR" && sha256sum -c deploy.tar.gz.sha256)
          mkdir -p "\$RELEASE_DIR"
          tar -xzf "\$TEMP_DIR/deploy.tar.gz" -C "\$RELEASE_DIR"
          ln -s "\$RELEASE_DIR" "\$WORK_DIR/current.next"
          mv -Tf "\$WORK_DIR/current.next" "\$WORK_DIR/current"
          bash "\$WORK_DIR/current/deploy/scripts/ssm-deploy.sh" prod "\${IMAGE_NAME}"
          EOF
          ENCODED_COMMAND=$(base64 -w 0 ssm-command.sh)
          jq -n --arg command "echo $ENCODED_COMMAND | base64 -d | sudo bash" \
            '{commands: [$command]}' > ssm-parameters.json
          COMMAND_ID=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$INSTANCE_ID" \
            --parameters file://ssm-parameters.json \
            --query 'Command.CommandId' \
            --output text)
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID"
